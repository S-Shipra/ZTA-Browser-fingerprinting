<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zero Trust Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>🛡️ Security Dashboard</h2>

<h3 id="alertBox"></h3>

<h3>Latest Risk Breakdown</h3>
<ul id="riskBreakdown"></ul>

<h3>ML Detection Status</h3>
<ul id="mlStatus"></ul>

<canvas id="riskChart" width="400" height="200"></canvas>

<table border="1">

        <tr>
            <th>User</th>
            <th>Action</th>
            <th>Risk</th>
            <th>Time</th>
        </tr>
    </thead>

    <tbody id="logsTable"></tbody>
</table>

<script src="js/dashboard.js"></script>

</body>
</html>
