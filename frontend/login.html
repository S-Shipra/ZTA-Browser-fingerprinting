<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTA — Secure Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/fingerprint.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="shield">🛡</div>
        <div>
          <span>ZeroTrust</span>
          <small>ZERO TRUST ARCHITECTURE</small>
        </div>
      </div>

      <h1 class="auth-title">Secure Access<br>Portal</h1>
      <p class="auth-sub">// IDENTITY VERIFICATION REQUIRED</p>

      <div class="fp-scan">
        <div class="fp-dot"></div>
        <span id="fpStatus">Collecting browser fingerprint...</span>
      </div>

      <div class="field">
        <label>Username</label>
        <input id="username" type="text" placeholder="enter username" autocomplete="off">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••">
      </div>

      <button class="btn-primary" id="loginBtn" onclick="login()">
        Authenticate
      </button>

      <div class="result-box" id="resultBox">
        <div id="result"></div>
        <div class="risk-bar-wrap" id="riskBarWrap" style="display:none">
          <div class="risk-bar" id="riskBar"></div>
        </div>
      </div>

    </div>
  </div>
<script>
window.addEventListener('load', async () => {
  try {
    const fp = await getFingerprint();
    document.getElementById('fpStatus').textContent =
      'Fingerprint collected — ' + fp.screen + ' · ' + fp.platform;
  } catch (e) {
    document.getElementById('fpStatus').textContent =
      'Fingerprint failed ❌';
    console.error("Fingerprint error:", e);
  }
});
</script>

</body>
</html>
